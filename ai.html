<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Works — Orhun Ege Eker</title>
<link rel="icon" type="image/png" href="media/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07090f; --text:#f6f7fb; --muted:#cbd5e1; --border:#1b1f2a; --accent:#3a7bff;
    --card-w: 160px; --card-h: 120px; --card-r: 14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:radial-gradient(1200px 800px at 50% -10%, rgba(50,90,170,0.12), transparent 60%) , var(--bg);
       color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}

  /* floating area */
  .stage{position:fixed;inset:0;overflow:hidden}
  .card{
    position:absolute;width:var(--card-w);height:var(--card-h);border-radius:var(--card-r);
    border:1px solid rgba(255,255,255,.12);background:#0c1120;overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.45);cursor:grab; user-select:none;
    transition:box-shadow .2s ease, transform .2s ease;
  }
  .card:active{cursor:grabbing}
  .thumb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .card .meta{
    position:absolute;left:8px;right:8px;bottom:8px;
    font-size:11px;color:#e8eefc;text-shadow:0 1px 2px rgba(0,0,0,.65);
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,12,.55) 48%, rgba(0,0,12,.85) 100%);
    padding:24px 8px 6px;border-radius:10px;
  }
  .meta .brand{opacity:.9}
  .meta .title{font-weight:800}

  /* gentle float */
  @keyframes drift {
    0%   { transform: translate(0,0) rotate(0deg); }
    50%  { transform: translate(0px, -4px) rotate(0.6deg); }
    100% { transform: translate(0,0) rotate(0deg); }
  }
  .card.float{ animation: drift 6s ease-in-out infinite; }

  /* HUD */
  .hud{
    position:fixed;left:12px;right:12px;top:10px;z-index:10;
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;border:1px solid rgba(255,255,255,.12);
    border-radius:14px;background:rgba(10,12,22,.55);backdrop-filter:blur(8px);
  }
  .brand{font-weight:800;letter-spacing:.2px}
  .nav{display:flex;gap:14px;font-size:14px}
  .nav a{color:var(--text);text-decoration:none;opacity:.9}
  .nav a:hover{opacity:1}

  /* overlay viewer */
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
           background:rgba(0,0,0,.55);backdrop-filter:blur(6px)}
  .overlay.show{display:flex}
  .viewer{
    width:min(1080px,94vw);max-height:92vh;border:1px solid rgba(255,255,255,.16);
    border-radius:16px;background:#0b0f1c;box-shadow:0 24px 70px rgba(0,0,0,.6);overflow:hidden;
  }
  .viewer-media{aspect-ratio:16/10;background:#0e1433;display:flex;align-items:center;justify-content:center}
  .viewer-media img{max-width:100%;max-height:70vh;display:block}
  .viewer-body{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .info{min-width:0}
  .t{font-weight:800}
  .b{font-size:12px;color:#cfd6e3}
  .p{margin-top:6px;color:#d7deea;line-height:1.6;font-size:14px}
  .ctrls{display:flex;align-items:center;gap:8px}
  .btn{padding:10px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#10172b;color:#fff;font-size:14px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:#2b66ff}
  .counter{font-size:12px;color:#cbd5e1;opacity:.9}

  /* clamp helper highlight (debug off by default) */
  .edge { outline: 0px solid red; }

  @media (max-width: 640px){
    :root{ --card-w: 130px; --card-h: 98px; }
  }
</style>
</head>
<body>
  <div class="hud">
    <div class="brand">ORHUN EGE EKER — AI WORKS</div>
    <div class="nav">
      <a href="/">SPACE</a>
      <a href="projects.html">PROJECTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT</a>
    </div>
  </div>

  <div class="stage" id="stage"></div>

  <!-- overlay viewer -->
  <div class="overlay" id="overlay" aria-hidden="true">
    <div class="viewer" role="dialog" aria-modal="true">
      <div class="viewer-media"><img id="vwImg" alt=""></div>
      <div class="viewer-body">
        <div class="info">
          <div class="t" id="vwTitle">Title</div>
          <div class="b" id="vwBrand">Brand</div>
          <div class="p" id="vwPurpose">Purpose text</div>
        </div>
        <div class="ctrls">
          <span class="counter" id="vwCount">1/1</span>
          <button class="btn" id="btnPrev" type="button">← Prev</button>
          <button class="btn" id="btnNext" type="button">Next →</button>
          <button class="btn" id="btnClose" type="button">Close (Esc)</button>
        </div>
      </div>
    </div>
  </div>

<script>
(async function(){
  const stage = document.getElementById('stage');
  const W = ()=>stage.clientWidth, H = ()=>stage.clientHeight;

  // Load data
  let items = [];
  try{
    const res = await fetch('aiworks.json?cb='+Date.now(), {cache:'no-store'});
    items = await res.json();
  }catch(e){
    console.error('aiworks.json yüklenemedi', e);
    items = [];
  }

  // Build 25 (ya da kaç varsa) floating cards
  const cards = [];
  const maxCards = Math.min(25, items.length);

  // helper: clamp position so card stays fully visible
  function clampIntoBounds(x, y, w, h){
    const nx = Math.max(6, Math.min(x, W()-w-6));
    const ny = Math.max(60, Math.min(y, H()-h-6)); // üstte HUD var
    return [nx, ny];
  }

  // Create card for each item
  for(let i=0;i<maxCards;i++){
    const it = items[i];
    const card = document.createElement('div');
    card.className = 'card float';
    card.dataset.index = i;

    const img = new Image();
    const coverSrc = (it.cover && it.cover.trim()) || (Array.isArray(it.images) ? it.images[0] : '');
    img.src = coverSrc || '';
    img.alt = it.title || ('AI Work ' + (i+1));
    img.className = 'thumb';

    // cover hata verirse kartı hiç eklemiyoruz
    let coverOk = false;
    await new Promise(resolve=>{
      img.onload = ()=>{ coverOk = true; resolve(); };
      img.onerror = ()=>{ coverOk = false; resolve(); };
    });
    if(!coverOk) continue;

    card.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.innerHTML = `<div class="title">${it.title||''}</div><div class="brand">${it.brand||''}</div>`;
    card.appendChild(meta);

    // random pos (clamped), small random rotation offset applied by drift anim
    const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));
    const ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h'));
    let x = Math.random()*(W()-cw-24)+12, y = Math.random()*(H()-ch-80)+70;
    ;[x,y] = clampIntoBounds(x,y,cw,ch);
    card.style.left = x+'px';
    card.style.top = y+'px';

    // gentle random drifting via transform translate (CSS handles micro drift),
    // we also add a very slow JS wander inside bounds
    const drift = { vx: (Math.random()*2-1)*0.12, vy:(Math.random()*2-1)*0.10 };

    // drag
    let dragging=false, ox=0, oy=0, sx=0, sy=0;
    card.addEventListener('pointerdown', (e)=>{
      dragging = true;
      card.classList.remove('float'); // anim devre dışı
      card.setPointerCapture(e.pointerId);
      sx = e.clientX; sy = e.clientY;
      ox = parseFloat(card.style.left)||0;
      oy = parseFloat(card.style.top)||0;
      e.preventDefault();
    });
    card.addEventListener('pointermove', (e)=>{
      if(!dragging) return;
      const nx = ox + (e.clientX - sx);
      const ny = oy + (e.clientY - sy);
      const [cx, cy] = clampIntoBounds(nx, ny, cw, ch);
      card.style.left = cx+'px';
      card.style.top  = cy+'px';
    });
    card.addEventListener('pointerup', (e)=>{
      dragging = false;
      // kenarda kalırsa hızını sıfırla ve tekrar float ver
      drift.vx = 0; drift.vy = 0;
      card.classList.add('float');
      try{ card.releasePointerCapture(e.pointerId); }catch{}
    });

    // click -> open viewer
    card.addEventListener('click', (e)=>{
      if(dragging) return; // drag bitişinde tetikleme
      openViewer(i, card);
    });

    // keep inside bounds while drifting
    function tickCard(){
      if(dragging) return;
      let cx = parseFloat(card.style.left)||0;
      let cy = parseFloat(card.style.top)||0;
      cx += drift.vx;
      cy += drift.vy;

      const [nx, ny] = clampIntoBounds(cx, cy, cw, ch);
      // eğer clamp olduysa hızları kes
      if(nx!==cx) drift.vx = 0;
      if(ny!==cy) drift.vy = 0;

      card.style.left = nx+'px';
      card.style.top  = ny+'px';
    }
    cards.push({el:card, tick:tickCard});
    stage.appendChild(card);
  }

  // master loop (very light)
  function loop(){
    cards.forEach(c=>c.tick());
    requestAnimationFrame(loop);
  }
  loop();

  /* ====== Overlay Viewer ====== */
  const overlay = document.getElementById('overlay');
  const vwImg = document.getElementById('vwImg');
  const vwTitle = document.getElementById('vwTitle');
  const vwBrand = document.getElementById('vwBrand');
  const vwPurpose = document.getElementById('vwPurpose');
  const vwCount = document.getElementById('vwCount');
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  const btnClose = document.getElementById('btnClose');

  let curIdx = 0;     // which item
  let curImgIdx = 0;  // which image within item
  let curImages = []; // filtered existing

  function preloadFilter(list){
    // sadece yüklenenleri döndür (sıra korunur)
    return Promise.all(list.map(src => new Promise(resolve=>{
      const im = new Image();
      im.onload = ()=>resolve(src);
      im.onerror = ()=>resolve(null);
      im.src = src;
    }))).then(arr => arr.filter(Boolean));
  }

  async function openViewer(index, cardEl){
    curIdx = index;
    const it = items[curIdx];

    // Görselleri filtrele (var olanlar)
    const imgs = Array.isArray(it.images) ? it.images : [];
    curImages = await preloadFilter(imgs);

    // hiç görsel yoksa kapat
    if(!curImages.length){ return; }

    curImgIdx = 0;
    renderViewer();

    // küçük anim: karttan overlay’e geçiş hissi
    overlay.style.opacity = '0';
    overlay.classList.add('show');
    overlay.setAttribute('aria-hidden','false');
    requestAnimationFrame(()=>{ overlay.style.transition='opacity .18s ease'; overlay.style.opacity='1'; });
  }

  function closeViewer(){
    overlay.style.opacity = '0';
    setTimeout(()=>{
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden','true');
      overlay.style.transition='';
      overlay.style.opacity='';
    }, 180);
  }

  function renderViewer(){
    const it = items[curIdx];
    vwTitle.textContent = it.title || '';
    vwBrand.textContent = it.brand || '';
    vwPurpose.textContent = it.purpose || '';
    vwImg.src = curImages[curImgIdx];
    vwCount.textContent = `${curImgIdx+1}/${curImages.length}`;
    // buton durumları
    btnPrev.disabled = (curImages.length<=1);
    btnNext.disabled = (curImages.length<=1);
  }

  function nextImg(){ if(curImages.length>1){ curImgIdx = (curImgIdx+1)%curImages.length; renderViewer(); } }
  function prevImg(){ if(curImages.length>1){ curImgIdx = (curImgIdx-1+curImages.length)%curImages.length; renderViewer(); } }

  btnNext.addEventListener('click', nextImg);
  btnPrev.addEventListener('click', prevImg);
  btnClose.addEventListener('click', closeViewer);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeViewer(); });
  window.addEventListener('keydown', (e)=>{
    if(!overlay.classList.contains('show')) return;
    if(e.key==='Escape') closeViewer();
    else if(e.key==='ArrowRight') nextImg();
    else if(e.key==='ArrowLeft') prevImg();
  });

  // Re-clamp on resize
  addEventListener('resize', ()=>{
    const cw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));
    const ch = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--card-h'));
    cards.forEach(({el})=>{
      let x=parseFloat(el.style.left)||0, y=parseFloat(el.style.top)||0;
      const [nx, ny] = clampIntoBounds(x,y,cw,ch);
      el.style.left = nx+'px'; el.style.top = ny+'px';
    });
  });
})();
</script>
</body>
</html>
